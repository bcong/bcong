<svg xmlns="http://www.w3.org/2000/svg" width="308" height="96" viewBox="0 0 308 96" role="img" aria-label="네이버 메일로 보내기"><style>text{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}@media (prefers-reduced-motion:reduce){.in,.nudge{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient></defs><g transform="translate(4 0)"><rect x="0.5" y="0.5" width="299" height="83" rx="14" fill="url(#bg)" stroke="#d0d7de"/><g class="in" style="animation-delay:.05s"><rect x="14.5" y="22.5" width="39" height="39" rx="12" fill="#f6f8fa" stroke="#d8dee4"/><g transform="translate(23 31) scale(0.9166666666666666)" fill="#1f2328"><path d="M16.273 12.845 7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845Z"/></g></g><g class="in" style="animation-delay:.15s"><text x="68" y="28" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1.2">EMAIL · NAVER</text><text x="68" y="46" font-size="12.5" font-weight="800" fill="#1f2328" letter-spacing="-0.2">sudn_@naver.com</text><text x="68" y="63" font-size="11" font-weight="400" fill="#57606a">보조 메일 주소</text></g><g class="in" style="animation-delay:.25s"><circle cx="274" cy="42" r="12" fill="#f6f8fa" stroke="#d0d7de"/><path class="nudge" d="M270.5 45.5L277.5 38.5M273 38.5H277.5V43" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>