<svg xmlns="http://www.w3.org/2000/svg" width="412" height="116" viewBox="0 0 412 116" role="img" aria-label="네이버 메일로 보내기"><style>text{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}@media (prefers-reduced-motion:reduce){.in,.nudge{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><g transform="translate(4 0)"><rect x="0.5" y="0.5" width="403" height="103" rx="16" fill="url(#bg)" stroke="#30363d"/><g class="in" style="animation-delay:.05s"><rect x="18.5" y="28.5" width="47" height="47" rx="14" fill="#1c2128" stroke="#30363d"/><g transform="translate(30 40) scale(1)" fill="#e6edf3"><path d="M16.273 12.845 7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845Z"/></g></g><g class="in" style="animation-delay:.15s"><text x="86" y="36" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1.2">EMAIL · NAVER</text><text x="86" y="57" font-size="17" font-weight="800" fill="#e6edf3" letter-spacing="-0.2">sudn_@naver.com</text><text x="86" y="76" font-size="12" font-weight="400" fill="#8b949e">보조 메일 주소</text></g><g class="in" style="animation-delay:.25s"><circle cx="371" cy="52" r="15" fill="#1c2128" stroke="#30363d"/><path class="nudge" d="M367 56L375 48M370 48H375V53" fill="none" stroke="#e6edf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>