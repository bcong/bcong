  <style>
    text { font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
    .in { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .draw { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 0.9s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; } .draw { animation: none; stroke-dashoffset: 0; } }
  </style>
